<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'poppins',sans-serif;
        }
        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#00c6ff);
            animation: bgMove 10s ease infinite;
            background-size: 400% 400%;
        }
        @keyframes bgMove{
            0%{background-position: 0% 50%;}
            50%{background-position: 100% 50%;}
            100%{background-position: 0% 50%;}
        }
        .container{
            position: relative;
            width: 350px;
            padding: 40px;
            border-radius: 25px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float{
            0%{transform: translateY(0px);}
            50%{transform: translateY(-10px);}
            100%{transform: translateY(0px);}
        }
        .container h2{
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
        }
        .input-box{
            position: relative;
            margin-bottom: 30px;
        }
        .input-box input{
            width: 100%;
            padding: 14px;
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(255,255,255,0.5);
            outline: none;
            color: white;
            font-size: 16px;
        }
        .input-box lable{
            position: absolute;
            top: 12px;
            left: 0;
            color: #ddd;
            pointer-events: none;
            transition: 0.4s;
        }
        .input-box input:focus ~ label,
        .input-box input:valid ~ label{
            top: -10px;
            font-size: 12px;
            color: #00eaff;
        }
        .login-btn{
            width: 100%;
            padding: 14px;
            border: none;
            outline: none;
            border-radius: 30px;
            background: linear-gradient(-45deg,#00eaff,#0072ff);
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.4s;
        }
        .login-btn:hover{
            transform: scale(1.05);
            box-shadow: 0 0 20px #00eaff;
        }
        .extra a{
            color: #00eaff;
            text-decoration: none;
        }
        .extra{
            margin-top: 20px;
            border-radius: 50px;
            background: rgba(255,255,255,0.1);
            animation: move 6s linear infinite;
        }
        circle:nth-child(1){
            width: 120px;
            height: 120px;
            top: -40px;
            left: -40px;
        }
        circle:nth-child(2){
            width: 120px;
            height: 120px;
            top: -30px;
            left: -30px;
        }
        @keyframes move{
            0%{transform: rotate(0deg) translateY(0px);}
            50%{transform: rotate(180deg)translateY(180px);}
            100%{transform: rotate(360deg)translateY(0px);}
        }

    </style>
</head>
<body>
    <div class="circle"></div>
    <div class="circle"></div>

    <h2>Login</h2>

    <form>
        <div class="input-box">
            <input type="text" required>
            <label>Username</label>
        </div>

        <div class="input-box">
            <input type="text" required>
            <label>Password</label>
        </div>
        <button class="login-btn">LOGIN</button>

        <div class="extra">
            Forget Password ? <a href="#">Click here</a>
        </div>
    </form>
</body>
</html>
